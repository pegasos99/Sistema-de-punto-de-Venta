name: POS backend checks

on:
  push:
    branches:
      - feature/backend-supabase
  pull_request:
    paths:
      - 'server/**'
      - 'supabase/migrations/**'
      - '.github/workflows/pos-backend.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript build
        run: npm run build
      - name: Validate domain rules
        run: npm test
      - name: Audit a bundled legacy JSON fixture (never commercial data)
        run: npm run audit:legacy -- ../.bolt/dbprueba
